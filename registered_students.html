<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داخل شدہ طلباء کی رپورٹ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'JameelNooriNastaleeq';
            src: url('./fonts/Jameel\ Noori\ Nastaleeq.ttf') format('truetype');
        }
        body {
            font-family: 'JameelNooriNastaleeq', Arial, sans-serif;
            background-color: #f3f4f6;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border: 1px solid #4b5563;
        }
        th, td {
            border: 1px solid #4b5563;
            padding: 10px;
            text-align: center;
            vertical-align: middle;
        }
        th {
            background-color: black;
            color: white;
            font-size: 1.2rem;
            font-weight: normal;
        }
        .bg-gray-cell {
            background-color: #e5e7eb;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <nav class="bg-green-700 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">داخل شدہ طلباء کی رپورٹ</h1>
            <a href="dashboard.html" class="bg-yellow-500 text-black px-4 py-2 rounded hover:bg-yellow-600 transition font-bold">واپس ڈیش بورڈ</a>
        </div>
    </nav>

    <main class="container mx-auto p-6 flex-grow">
        <div class="bg-white p-8 rounded-lg shadow-xl border-t-4 border-green-700">
            
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-gray-800">کسی بھی طالب علم کا داخلہ فارم نکالنے کے لئے اس کے داخلہ فارم کے لنک پر کلک کریں۔</h2>
            </div>

            <!-- فلٹرز کا سیکشن -->
            <div class="flex flex-wrap justify-center items-center gap-6 mb-6">
                <!-- درجہ منتخب کریں (فارم والے اصلی درجات) -->
                <div class="flex items-center gap-2">
                    <label class="text-lg font-bold">درجہ منتخب کریں</label>
                    <select id="classFilter" class="px-4 py-1 border border-gray-400 rounded w-64 bg-white">
                        <option value="">تمام درجات</option>
                        <option value="قاری محمد اسحاق (ناظرہ)">قاری محمد اسحاق (ناظرہ)</option>
                        <option value="تحفیظ القرآن">تحفیظ القرآن</option>
                        <option value="تجوید سال اول">تجوید سال اول</option>
                        <option value="عالمہ / عالم سال اول">عالمہ / عالم سال اول</option>
                    </select>
                </div>

                <!-- تاریخ سے -->
                <div class="flex items-center gap-2">
                    <label class="text-lg font-bold">تاریخ سے</label>
                    <input type="date" id="fromDate" class="px-4 py-1 border border-gray-400 rounded bg-white">
                </div>

                <!-- تاریخ تک -->
                <div class="flex items-center gap-2">
                    <label class="text-lg font-bold">تاریخ تک</label>
                    <input type="date" id="toDate" class="px-4 py-1 border border-gray-400 rounded bg-white">
                </div>

                <!-- تلاش کا بٹن -->
                <div>
                    <button id="searchBtn" class="bg-[#0f172a] text-white px-6 py-1.5 font-bold hover:bg-gray-800 transition rounded border border-gray-500 shadow">
                        تلاش کریں
                    </button>
                </div>
            </div>

            <!-- طلباء کا ٹیبل -->
            <div class="overflow-x-auto mt-4">
                <table id="registeredStudentsTable">
                    <thead>
                        <tr>
                            <th class="w-16">نمبر شمار</th>
                            <th class="w-48">نام طالب علم</th>
                            <th class="w-32">رجسٹریشن نمبر</th>
                            <th class="w-28">تاریخ پیدائش</th>
                            <th class="w-20">داخلہ نمبر</th>
                            <th>مستقل پتا</th>
                            <th class="bg-gray-cell text-black font-bold border-black w-32">درجہ</th>
                            <th class="w-28">داخلہ فارم</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="8" class="bg-gray-cell text-center py-6 text-lg font-bold">ڈیٹا لوڈ ہو رہا ہے...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </main>

    <!-- جاوا اسکرپٹ -->
    <script type="module">
        import { supabase } from './js/supabase.js';

        const tableBody = document.getElementById('tableBody');
        const classFilter = document.getElementById('classFilter');
        const fromDate = document.getElementById('fromDate');
        const toDate = document.getElementById('toDate');
        const searchBtn = document.getElementById('searchBtn');

        let allStudents = [];

        // 1. ڈیٹا بیس سے طلباء کا ریکارڈ لانا
        async function fetchRegisteredStudents() {
            try {
                const activeBranch = localStorage.getItem('activeBranch') || 'central';
                
                const { data, error } = await supabase
                    .from('students')
                    .select('*')
                    .eq('branch_type', activeBranch)
                    .order('created_at', { ascending: false });

                if (error) throw error;
                
                allStudents = data;
                displayData(allStudents);
            } catch (err) {
                console.error("Error:", err);
                tableBody.innerHTML = `<tr><td colspan="8" class="text-center text-red-500 py-4">ڈیٹا لوڈ کرنے میں مسئلہ پیش آیا۔</td></tr>`;
            }
        }

        // 2. ٹیبل میں ریکارڈ دکھانا
        function displayData(data) {
            tableBody.innerHTML = '';
            
            if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="8" class="bg-gray-cell text-center py-4">کوئی ریکارڈ نہیں ملا۔</td></tr>`;
                return;
            }

            data.forEach((student, index) => {
                const tr = document.createElement('tr');
                // تاریخ پیدائش کا فارمیٹ تبدیل کرنا (YYYY-MM-DD سے DD-MM-YYYY)
                const dobFormatted = student.dob ? student.dob.split('-').reverse().join('-') : '-';
                
                tr.innerHTML = `
                    <td class="bg-gray-cell">${index + 1}</td>
                    <td class="bg-gray-cell text-lg font-bold">${student.student_name || '-'}</td>
                    <td class="bg-gray-cell text-blue-600 tracking-wider font-sans"><a href="print_form.html?reg=${student.reg_number}" class="hover:underline">${student.reg_number || '-'}</a></td>
                    <td class="bg-gray-cell font-sans">${dobFormatted}</td>
                    <td class="bg-gray-cell font-sans">${student.admission_number || '-'}</td>
                    <td class="bg-gray-cell text-base leading-relaxed text-right">${student.permanent_address || '-'}</td>
                    <td class="bg-gray-cell font-bold text-lg leading-tight text-red-600">${student.class_name || '-'}</td>
                   <td class="bg-gray-cell flex gap-1 items-center justify-center p-2">
    <button onclick="editStudent('${student.reg_number}')" class="bg-yellow-500 text-white px-3 py-1 rounded text-sm hover:bg-yellow-600 transition font-bold">ایڈٹ</button>
    <button onclick="deleteStudent('${student.reg_number}')" class="bg-red-600 text-white px-3 py-1 rounded text-sm hover:bg-red-700 transition font-bold">ڈیلیٹ</button>
    <a href="print_form.html?reg=${student.reg_number}" class="bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700 transition font-bold">فارم</a>
    <a href="id_card.html?reg=${student.reg_number}" class="bg-purple-600 text-white px-3 py-1 rounded text-sm hover:bg-purple-700 transition font-bold">کارڈ</a>
</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // 3. فلٹر کرنے کا فنکشن (جب تلاش کریں بٹن دبایا جائے)
        searchBtn.addEventListener('click', () => {
            const selectedClass = classFilter.value;
            const start = fromDate.value;
            const end = toDate.value;

            let filteredData = allStudents;

            // درجہ کے لحاظ سے فلٹر
            if (selectedClass) {
                filteredData = filteredData.filter(student => student.class_name === selectedClass);
            }
            
            // تاریخ سے فلٹر
            if (start) {
                filteredData = filteredData.filter(student => student.admission_date >= start);
            }
            
            // تاریخ تک فلٹر
            if (end) {
                filteredData = filteredData.filter(student => student.admission_date <= end);
            }

            displayData(filteredData);
        });

        // پیج لوڈ ہوتے ہی فنکشن چلانا
        document.addEventListener('DOMContentLoaded', fetchRegisteredStudents);
        // ڈیلیٹ کرنے کا فنکشن
    window.deleteStudent = async function(regNumber) {
        const confirmDelete = confirm(`کیا آپ واقعی رجسٹریشن نمبر ${regNumber} کا ریکارڈ ڈیلیٹ کرنا چاہتے ہیں؟ یہ عمل واپس نہیں ہو سکے گا۔`);
        
        if(confirmDelete) {
            try {
                // Supabase سے ریکارڈ ہمیشہ کے لیے حذف کرنا
                const { error } = await supabase
                    .from('students')
                    .delete()
                    .eq('reg_number', regNumber);
                    
                if (error) throw error;
                
                alert('طالب علم کا ریکارڈ کامیابی سے ڈیلیٹ ہو گیا ہے۔');
                window.location.reload(); // پیج ریفریش تاکہ لسٹ اپڈیٹ ہو جائے
                
            } catch (err) {
                alert('ریکارڈ ڈیلیٹ کرنے میں مسئلہ آیا: ' + err.message);
            }
        }
    };

    // ایڈٹ کرنے کا فنکشن
    window.editStudent = function(regNumber) {
        // ایڈٹ کے لیے ہم یوزر کو داخلہ فارم پر بھیجیں گے جہاں اس کا پرانا ڈیٹا خود فل ہو جائے گا
        window.location.href = `admission.html?edit=${regNumber}`;
    };

    </script>
</body>
</html>
