<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تلاش کیجیے - مدرسہ مینجمنٹ سسٹم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'JameelNooriNastaleeq';
            src: url('./fonts/Jameel\ Noori\ Nastaleeq.ttf') format('truetype');
        }
        body {
            font-family: 'JameelNooriNastaleeq', Arial, sans-serif;
            background-color: #f3f4f6;
        }
        table, th, td {
            border: 1px solid #d1d5db;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- ہیڈر -->
    <header class="bg-green-700 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">طلباء کا ریکارڈ تلاش کریں</h1>
            <a href="dashboard.html" class="bg-yellow-500 text-black px-4 py-2 rounded hover:bg-yellow-600 transition font-bold">واپس ڈیش بورڈ</a>
        </div>
    </header>

    <main class="container mx-auto p-4 mt-6">
        
        <div class="bg-white rounded-lg shadow-lg p-6 border-t-4 border-green-700">
            
            <!-- سرچ بار -->
            <div class="mb-6">
                <input type="text" id="searchInput" placeholder="طالب علم کا نام، رجسٹریشن نمبر، یا فون نمبر لکھ کر تلاش کریں..." 
                       class="w-full border-2 border-gray-300 px-4 py-3 rounded-md text-lg outline-none focus:border-green-600 transition">
            </div>

            <!-- طلباء کا ٹیبل -->
            <div class="overflow-x-auto">
                <table class="w-full text-center border-collapse">
                    <thead>
                        <tr class="bg-green-700 text-white font-bold">
                            <th class="py-3 px-2 w-16">تصویر</th>
                            <th class="py-3 px-2">رجسٹریشن نمبر</th>
                            <th class="py-3 px-2">نام طالب علم</th>
                            <th class="py-3 px-2">ولدیت / پتہ</th>
                            <th class="py-3 px-2">فون نمبر</th>
                            <th class="py-3 px-2 w-1/4">مستقل پتہ</th>
                            <th class="py-3 px-2">درجہ</th>
                            <th class="py-3 px-2">رہائشی / غیر رہائشی</th>
                            <th class="py-3 px-2">سٹیٹس</th>
                            <th class="py-3 px-2 w-24">ایکشن</th>
                        </tr>
                    </thead>
                    <tbody id="searchTableBody">
                        <!-- ڈیفالٹ خالی میسج -->
                        <tr>
                            <td colspan="10" class="py-12 text-xl text-gray-500">
                                ریکارڈ دیکھنے کے لیے اوپر سرچ باکس میں نام یا نمبر لکھیں۔
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>

    </main>

    <script type="module">
        import { supabase } from './js/supabase.js';

        const searchInput = document.getElementById('searchInput');
        const tbody = document.getElementById('searchTableBody');

        // جب بھی یوزر کچھ ٹائپ کرے گا تو یہ فنکشن چلے گا
        searchInput.addEventListener('input', async (e) => {
            const query = e.target.value.trim();

            // اگر سرچ باکس خالی ہو جائے تو ٹیبل بھی خالی کر دو
            if(query === '') {
                tbody.innerHTML = `<tr><td colspan="10" class="py-12 text-xl text-gray-500">ریکارڈ دیکھنے کے لیے اوپر سرچ باکس میں نام یا نمبر لکھیں۔</td></tr>`;
                return;
            }

            // تلاش کرتے وقت لوڈنگ دکھانا
            tbody.innerHTML = `<tr><td colspan="10" class="py-8 text-lg text-blue-600">تلاش جاری ہے...</td></tr>`;

            try {
                // Supabase سے ڈیٹا تلاش کرنا (نام، رجسٹریشن نمبر، یا فون نمبر سے)
                const { data, error } = await supabase
                    .from('students')
                    .select('*')
                    .or(`student_name.ilike.%${query}%,reg_number.ilike.%${query}%,phone.ilike.%${query}%`)
                    .limit(50); // زیادہ سے زیادہ 50 نتائج دکھائے تاکہ پیج ہینگ نہ ہو

                if (error) throw error;

                // اگر کوئی ریکارڈ نہ ملے
                if(data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="10" class="py-8 text-lg text-red-600 font-bold">اس نام یا نمبر سے کوئی طالب علم نہیں ملا!</td></tr>`;
                    return;
                }

                // اگر ریکارڈ مل جائے تو ٹیبل میں دکھانا
                let html = '';
                data.forEach(student => {
                    // تصویر کا لنک بنانا
                   // تصویر کا لنک بنانا
let imgHtml = '<div class="w-10 h-10 bg-gray-200 rounded-full mx-auto flex items-center justify-center text-xs">نہیں</div>';
if (student.photo_url) {
    imgHtml = `<img src="${student.photo_url}" class="w-10 h-10 rounded-full mx-auto object-cover border border-gray-300">`;
}

                    html += `
                        <tr class="hover:bg-gray-50 border-b transition">
                            <td class="py-2 px-1">${imgHtml}</td>
                            <td class="py-2 px-1 font-bold font-sans text-sm">${student.reg_number || '-'}</td>
                            <td class="py-2 px-1 font-bold text-green-700">${student.student_name || '-'}</td>
                            <td class="py-2 px-1">${student.parent_name || '-'}</td>
                            <td class="py-2 px-1 font-sans text-sm">${student.phone || '-'}</td>
                            <td class="py-2 px-1 text-xs leading-relaxed">${student.permanent_address || '-'}</td>
                            <td class="py-2 px-1 text-blue-700">${student.class_name || '-'}</td>
                            <td class="py-2 px-1">${student.residential_status || '-'}</td>
                            <td class="py-2 px-1">
                                <span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs">داخل شدہ</span>
                            </td>
                            <td class="py-2 px-1 flex justify-center gap-1 mt-1">
                                <button onclick="editStudent('${student.reg_number}')" class="bg-yellow-500 text-white px-2 py-1 rounded text-xs hover:bg-yellow-600">ترمیم</button>
                                <button onclick="deleteStudent('${student.reg_number}')" class="bg-red-600 text-white px-2 py-1 rounded text-xs hover:bg-red-700">حذف</button>
                            </td>
                        </tr>
                    `;
                });

                tbody.innerHTML = html;

            } catch (err) {
                console.error("Search Error:", err);
                tbody.innerHTML = `<tr><td colspan="10" class="py-8 text-red-600">تلاش کے دوران کچھ مسئلہ ہوا ہے۔</td></tr>`;
            }
        });

        // ترمیم اور حذف کے عارضی فنکشنز
       // ترمیم (Edit) کا فنکشن - جو آپ کے بنے ہوئے پیج پر بھیجے گا
        window.editStudent = function(regNum) {
            // اگر آپ کے داخلہ فارم کا نام کچھ اور ہے (جیسے edit.html) تو نیچے نام تبدیل کر لیں۔
            // یہ URL میں ?edit=0001 کی شکل میں نمبر بھیجے گا جسے آپ کا پرانا کوڈ خود پکڑ لے گا۔
            window.location.href = `admission.html?edit=${regNum}`; 
        };

        // حذف (Delete) کا فنکشن - Supabase سے ریکارڈ ڈیلیٹ کرنے کے لیے
        window.deleteStudent = async function(regNum) {
            if(confirm("کیا آپ واقعی اس طالب علم کا ریکارڈ مکمل طور پر حذف (Delete) کرنا چاہتے ہیں؟ یہ عمل واپس نہیں ہو سکے گا!")) {
                try {
                    const { error } = await supabase
                        .from('students')
                        .delete()
                        .eq('reg_number', regNum);
                    
                    if (error) throw error;
                    
                    alert("الحمدللہ! طالب علم کا ریکارڈ کامیابی سے حذف ہو گیا ہے۔");
                    
                    // ڈیلیٹ ہونے کے بعد سرچ لسٹ کو خودبخود اپڈیٹ (ریفریش) کرنے کے لیے
                    document.getElementById('searchInput').dispatchEvent(new Event('input'));

                } catch(err) {
                    alert("ریکارڈ حذف کرنے میں مسئلہ آیا: " + err.message);
                }
            }
        };
    </script>
</body>
</html>
