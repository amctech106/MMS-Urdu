<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داخلہ فارم - مدرسہ مینجمنٹ سسٹم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'JameelNooriNastaleeq';
            src: url('./fonts/JameelNooriNastaleeq.ttf') format('truetype');
        }
        body {
            font-family: 'JameelNooriNastaleeq', Arial, sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- ٹاپ نیویگیشن (واپس جانے کے لیے) -->
    <nav class="bg-green-700 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">نیا داخلہ فارم</h1>
            <a href="dashboard.html" class="bg-yellow-500 text-black px-4 py-2 rounded hover:bg-yellow-600 transition font-bold">واپس ڈیش بورڈ</a>
        </div>
    </nav>

    <!-- داخلہ فارم کا مرکزی حصہ -->
    <main class="container mx-auto p-6 flex-grow flex justify-center">
        <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-4xl border-t-4 border-green-700">
            
            <div class="text-center mb-8 border-b-2 border-gray-200 pb-4">
                <h2 class="text-3xl font-bold text-green-800">داخلہ فارم برائے <span id="branchTitleDisplay">بنین</span></h2>
                <p class="text-gray-600 mt-2">دارالعلوم جامعہ نعیمیہ فیڈرل بی ایریا کراچی</p>
            </div>

            <form id="admissionForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- طالب علم کا نام -->
                <div>
                    <label class="block text-lg font-semibold text-gray-700 mb-1">نام <span class="student-label">طالب علم</span>:</label>
                    <input type="text" id="studentName" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 bg-gray-50" required>
                </div>

                <!-- ولدیت / بنت -->
                <div>
                    <label class="block text-lg font-semibold text-gray-700 mb-1"><span class="parent-label">ولدیت</span>:</label>
                    <input type="text" id="parentName" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 bg-gray-50" required>
                </div>

                <!-- تاریخ پیدائش -->
                <div>
                    <label class="block text-lg font-semibold text-gray-700 mb-1">تاریخ پیدائش:</label>
                    <input type="date" id="dob" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 bg-gray-50" required>
                </div>

                <!-- رابطہ نمبر -->
                <div>
                    <label class="block text-lg font-semibold text-gray-700 mb-1">رابطہ نمبر / سرپرست کا موبائل نمبر:</label>
                    <input type="text" id="phone" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 bg-gray-50" required>
                </div>

                <!-- مستقل پتا -->
                <div class="md:col-span-2">
                    <label class="block text-lg font-semibold text-gray-700 mb-1">مستقل پتا:</label>
                    <input type="text" id="permanentAddress" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 bg-gray-50" required>
                </div>

                <!-- موجودہ پتا -->
                <div class="md:col-span-2">
                    <label class="block text-lg font-semibold text-gray-700 mb-1">موجودہ پتا:</label>
                    <input type="text" id="currentAddress" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 bg-gray-50">
                </div>

                <!-- الدرجہ (Class) -->
                <div>
                    <label class="block text-lg font-semibold text-red-600 mb-1">الدرجہ (کلاس):</label>
                    <select id="classSelect" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-red-500 bg-gray-50" required>
                        <option value="">درجہ منتخب کریں...</option>
                        <option value="tajweed_1">تجوید سال اول</option>
                        <option value="hifz">تحفیظ القرآن</option>
                        <option value="darse_nizami_1">عالمہ / عالم سال اول</option>
                        <!-- مزید درجات یہاں ڈائنیمک طریقے سے آئیں گے -->
                    </select>
                </div>

                <!-- رہائش کی نوعیت -->
                <div>
                    <label class="block text-lg font-semibold text-gray-700 mb-1">رہائش کی نوعیت:</label>
                    <select id="residentialStatus" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 bg-gray-50">
                        <option value="غیر رہائشی">غیر رہائشی</option>
                        <option value="رہائشی">رہائشی</option>
                    </select>
                </div>

                <!-- تصویر اپلوڈ -->
                <div class="md:col-span-2 border-2 border-dashed border-gray-300 p-4 rounded-md text-center">
                    <label class="block text-lg font-semibold text-gray-700 mb-2">تصویر منتخب کریں</label>
                    <input type="file" id="studentPhoto" accept="image/*" class="w-full text-gray-600">
                </div>

                <!-- بٹنز -->
                <div class="md:col-span-2 flex justify-end space-x-4 space-x-reverse mt-4">
                    <button type="button" class="bg-gray-500 text-white px-6 py-2 rounded hover:bg-gray-600 transition text-lg">فارم کلین کریں</button>
                    <button type="submit" class="bg-blue-700 text-white px-8 py-2 rounded hover:bg-blue-800 transition font-bold text-lg shadow-lg">محفوظ کریں</button>
                </div>
            </form>
        </div>
    </main>

    <script type="module" src="js/admission.js"></script>
</body>
</html>
