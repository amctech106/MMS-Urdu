<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدرسہ مینجمنٹ سسٹم - لاگ ان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'JameelNooriNastaleeq';
            src: url('./fonts/Jameel\ Noori\ Nastaleeq.ttf') format('truetype');
        }
        body {
            font-family: 'JameelNooriNastaleeq', Arial, sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">

    <div class="w-full max-w-md p-8 bg-white rounded-lg shadow-xl border-t-4 border-green-700">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-green-800 mb-2">دارالعلوم جامعہ نعیمیہ</h1>
            <p class="text-gray-600 text-lg">مدرسہ مینجمنٹ سسٹم</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <!-- برانچ کا انتخاب -->
            <div>
                <label class="block text-lg font-semibold text-gray-700 mb-2">شعبہ (برانچ) منتخب کریں:</label>
                <select id="branchSelect" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500 text-xl">
                    <option value="central">مرکزی شعبہ (بنین)</option>
                    <option value="branches">دیگر برانچز</option>
                    <option value="girls">شعبہ بنات (طالبات)</option>
                </select>
            </div>

            <!-- یوزر آئی ڈی -->
            <div>
                <label class="block text-lg font-semibold text-gray-700 mb-2">یوزر آئی ڈی:</label>
                <!-- فی الحال ٹیسٹنگ کے لیے آپ یہاں کچھ بھی ٹائپ کر سکتے ہیں -->
                <input type="text" id="username" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 text-xl" required>
            </div>

            <!-- پاس ورڈ -->
            <div>
                <label class="block text-lg font-semibold text-gray-700 mb-2">پاس ورڈ:</label>
                <input type="password" id="password" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 text-xl" required>
            </div>

            <!-- لاگ ان بٹن -->
            <button type="submit" class="w-full bg-green-700 hover:bg-green-800 text-white font-bold py-3 px-4 rounded-md text-2xl transition duration-300">
                سسٹم میں داخل ہوں
            </button>
        </form>
    </div>

    <script>
        // لاگ ان ہونے پر ڈیش بورڈ پر بھیجنے کی لاجک
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const branch = document.getElementById('branchSelect').value;
            
            // برانچ کی سیٹنگ لوکل اسٹوریج میں محفوظ کریں تاکہ باقی پیجز پر بھی کام آئے
            localStorage.setItem('activeBranch', branch);
            
            // لاگ ان کے بعد سیدھا ڈیش بورڈ پر بھیج دیں
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
