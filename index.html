<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داخلہ فارم - مدرسہ مینجمنٹ سسٹم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'JameelNooriNastaleeq';
            src: url('./fonts/JameelNooriNastaleeq.ttf') format('truetype');
        }
        body {
            font-family: 'JameelNooriNastaleeq', Arial, sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- ٹاپ نیویگیشن -->
    <nav class="bg-green-700 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">نیا داخلہ فارم</h1>
            <a href="dashboard.html" class="bg-yellow-500 text-black px-4 py-2 rounded hover:bg-yellow-600 transition font-bold">واپس ڈیش بورڈ</a>
        </div>
    </nav>

    <!-- داخلہ فارم کا مرکزی حصہ -->
    <main class="container mx-auto p-6 flex-grow flex justify-center">
        <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-4xl border-t-4 border-green-700">
            
            <div class="text-center mb-8 border-b-2 border-gray-200 pb-4">
                <h2 class="text-3xl font-bold text-green-800">دارالعلوم جامعہ نعیمیہ - داخلہ فارم برائے <span id="branchTitleDisplay">بنین</span></h2>
                <p class="text-gray-600 mt-2">فیڈرل بی ایریا کراچی</p>
            </div>

            <form id="admissionForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- تصویر اور اپلوڈ سیکشن -->
                <div class="md:col-span-2 flex items-center space-x-6 space-x-reverse bg-gray-50 p-4 rounded-lg border">
                    <div class="w-32 h-36 bg-gray-200 border-2 border-dashed border-gray-400 flex items-center justify-center text-gray-500 rounded">
                        تصویر یہاں آئے گی
                    </div>
                    <div>
                        <label class="block text-lg font-semibold text-gray-700 mb-2">طالب علم کی تصویر منتخب کریں:</label>
                        <input type="file" id="studentPhoto" accept="image/*" class="text-gray-600">
                    </div>
                </div>

                <!-- نام طالب علم / طالبہ -->
                <div>
                    <label class="block text-lg font-semibold text-gray-700 mb-1">نام <span class="student-label">طالب علم</span>:</label>
                    <input type="text" id="studentName" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 bg-gray-50" required>
                </div>

                <!-- ولدیت / بنت -->
                <div>
                    <label class="block text-lg font-semibold text-gray-700 mb-1"><span class="parent-label">ولدیت</span>:</label>
                    <input type="text" id="parentName" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 bg-gray-50" required>
                </div>

                <!-- تعلیمی درجہ -->
                <div>
                    <label class="block text-lg font-semibold text-gray-700 mb-1">تعلیمی درجہ:</label>
                    <select id="classSelect" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 bg-gray-50" required>
                        <option value="">درجہ منتخب کریں...</option>
                        <option value="تجوید سال اول">تجوید سال اول</option>
                        <option value="تحفیظ القرآن">تحفیظ القرآن</option>
                        <option value="عالمہ / عالم سال اول">عالمہ / عالم سال اول</option>
                    </select>
                </div>

                <!-- شعبہ تعلیم -->
                <div>
                    <label class="block text-lg font-semibold text-gray-700 mb-1">شعبہ تعلیم:</label>
                    <input type="text" id="department" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 bg-gray-50" placeholder="مثلاً: حفظ و ناظرہ / درس نظامی">
                </div>

                <!-- رہائش کی نوعیت -->
                <div>
                    <label class="block text-lg font-semibold text-gray-700 mb-1">رہائش کی نوعیت:</label>
                    <select id="residentialStatus" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 bg-gray-50">
                        <option value="غیر رہائشی">غیر رہائشی</option>
                        <option value="رہائشی">رہائشی</option>
                    </select>
                </div>

                <!-- خاص اور مہتمم کا نام -->
                <div>
                    <label class="block text-lg font-semibold text-gray-700 mb-1">خاص اور مہتمم کا نام:</label>
                    <input type="text" id="principalNote" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 bg-gray-50">
                </div>

                <!-- رجسٹریشن نمبر -->
                <div>
                    <label class="block text-lg font-semibold text-gray-700 mb-1">رجسٹریشن نمبر:</label>
                    <input type="text" id="regNumber" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 bg-gray-50" placeholder="خودکار یا دستی">
                </div>

                <!-- الحاق نمبر -->
                <div>
                    <label class="block text-lg font-semibold text-gray-700 mb-1">الحاق نمبر:</label>
                    <input type="text" id="affiliateNumber" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 bg-gray-50">
                </div>

                <!-- فون نمبر -->
                <div>
                    <label class="block text-lg font-semibold text-gray-700 mb-1">فون نمبر:</label>
                    <input type="text" id="phone" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 bg-gray-50">
                </div>

                <!-- والد یا سرپرست کا موبائل نمبر -->
                <div>
                    <label class="block text-lg font-semibold text-gray-700 mb-1">والد یا سرپرست کا موبائل نمبر:</label>
                    <input type="text" id="guardianPhone" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 bg-gray-50">
                </div>

                <!-- قومی شناختی کارڈ نمبر / ب فارم نمبر -->
                <div>
                    <label class="block text-lg font-semibold text-gray-700 mb-1">قومی شناختی کارڈ نمبر / ب فارم:</label>
                    <input type="text" id="cnicOrBForm" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 bg-gray-50">
                </div>

                <!-- تاریخ پیدائش -->
                <div>
                    <label class="block text-lg font-semibold text-gray-700 mb-1">تاریخ پیدائش:</label>
                    <input type="date" id="dob" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 bg-gray-50">
                </div>

                <!-- تاریخ داخلہ -->
                <div>
                    <label class="block text-lg font-semibold text-gray-700 mb-1">تاریخ داخلہ:</label>
                    <input type="date" id="admissionDate" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 bg-gray-50">
                </div>

                <!-- تاریخ اختتام / سیشن -->
                <div>
                    <label class="block text-lg font-semibold text-gray-700 mb-1">تاریخ اختتام (سیشن):</label>
                    <input type="date" id="endDate" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 bg-gray-50">
                </div>

                <!-- مستقل پتا -->
                <div class="md:col-span-2">
                    <label class="block text-lg font-semibold text-gray-700 mb-1">مستقل پتا:</label>
                    <input type="text" id="permanentAddress" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 bg-gray-50">
                </div>

                <!-- موجودہ پتا -->
                <div class="md:col-span-2">
                    <label class="block text-lg font-semibold text-gray-700 mb-1">موجودہ پتا:</label>
                    <input type="text" id="currentAddress" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 bg-gray-50">
                </div>

                <!-- بٹنز -->
                <div class="md:col-span-2 flex justify-end space-x-4 space-x-reverse mt-4">
                    <button type="reset" class="bg-gray-500 text-white px-6 py-2 rounded hover:bg-gray-600 transition text-lg">فارم کلین کریں</button>
                    <button type="submit" class="bg-blue-700 text-white px-8 py-2 rounded hover:bg-blue-800 transition font-bold text-lg shadow-lg">محفوظ کریں</button>
                </div>
            </form>
        </div>
    </main>

    <!-- جاوا اسکرپٹ -->
    <script type="module">
        import { supabase } from './js/supabase.js';

        document.addEventListener('DOMContentLoaded', () => {
            const activeBranch = localStorage.getItem('activeBranch') || 'central';
            const branchTitleDisplay = document.getElementById('branchTitleDisplay');
            
            if(activeBranch === 'girls') {
                branchTitleDisplay.innerText = 'شعبہ بنات';
                document.querySelectorAll('.student-label').forEach(el => el.innerText = 'طالبہ');
                document.querySelectorAll('.parent-label').forEach(el => el.innerText = 'بنت');
            } else {
                branchTitleDisplay.innerText = 'بنین (مرکزی)';
            }
        });

        document.getElementById('admissionForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const studentName = document.getElementById('studentName').value;
            const parentName = document.getElementById('parentName').value;
            const branchType = localStorage.getItem('activeBranch') || 'central';
            const parentRelation = (branchType === 'girls') ? 'بنت' : 'ولد';
            const regNumber = document.getElementById('regNumber').value || ('REG-' + new Date().getTime());
            const residentialStatus = document.getElementById('residentialStatus').value;
            const phone = document.getElementById('phone').value;
            const permanentAddress = document.getElementById('permanentAddress').value;

            try {
                const { data, error } = await supabase
                    .from('students')
                    .insert([
                        {
                            reg_number: regNumber,
                            branch_type: branchType,
                            student_name: studentName,
                            parent_relation: parentRelation,
                            parent_name: parentName,
                            residential_status: residentialStatus,
                            phone: phone,
                            permanent_address: permanentAddress,
                            status: 'داخل شدہ'
                        }
                    ]);

                if (error) {
                    alert('ڈیٹا محفوظ کرنے میں مسئلہ: ' + error.message);
                } else {
                    alert('طالب علم کا داخلہ فارم کامیابی سے محفوظ ہو گیا ہے!');
                    document.getElementById('admissionForm').reset();
                }
            } catch (err) {
                alert('سسٹم میں خرابی پیش آئی۔');
            }
        });
    </script>
</body>
</html>
